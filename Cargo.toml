[workspace]
resolver = "2"
members = ["crates/myroots-core", "crates/myroots-wasm", "crates/myroots-store", "src-tauri"]

[workspace.package]
version = "3.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Jarek Hirsch <jarekhirsz.biz@gmail.com>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.wasm]
inherits = "release"
opt-level = "z"
panic = "abort"
