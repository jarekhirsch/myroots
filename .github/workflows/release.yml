# Builds the installers for a version tag (v*) and puts them on a draft release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  # all tests first (tests.yml); nothing is built when one fails
  tests:
    uses: ./.github/workflows/tests.yml

  desktop:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          # Linux on ARM (Raspberry Pi 4/5, ARM laptops)
          - platform: ubuntu-22.04-arm
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux libraries
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Apple signing and notarization (only when the secrets are set)
        if: matrix.platform == 'macos-latest'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CERT" ]; then
            {
              echo "APPLE_CERTIFICATE=$CERT"
              echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$TEAM"
            } >> "$GITHUB_ENV"
          else
            echo "No Apple certificate: the macOS build is not signed."
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MyRoots ${{ github.ref_name }}'
          releaseBody: 'See CHANGELOG.md. Installers for macOS, Windows and Linux, and the browser version (myroots-web.zip).'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && ' --config src-tauri/tauri.updater.conf.json' || '' }}

  # Microsoft Store package (MSIX); the Store version has no self-updates.
  store:
    needs: desktop
    runs-on: windows-latest
    env:
      MSSTORE: ${{ secrets.MSSTORE_CLIENT_SECRET != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build the app for the Store (no self-updates)
        env:
          VITE_MYROOTS_STORE: '1'
        run: npx tauri build --no-bundle
      - name: MSIX package
        id: msix
        shell: pwsh
        run: ./scripts/msix.ps1
      - name: Check the package (unpacks, right version, the app inside)
        shell: pwsh
        run: |
          $mk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter makeappx.exe | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          & $mk.FullName unpack /o /p "${{ steps.msix.outputs.msix }}" /d target/msix/check
          if ($LASTEXITCODE -ne 0) { throw 'MSIX does not unpack' }
          $m = [xml](Get-Content target/msix/check/AppxManifest.xml)
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version + '.0'
          if ($m.Package.Identity.Version -ne $v) { throw "MSIX version $($m.Package.Identity.Version) is not $v" }
          if (-not (Test-Path target/msix/check/myroots.exe)) { throw 'myroots.exe missing in the MSIX' }
          if ((Get-Item target/msix/check/myroots.exe).Length -lt 5MB) { throw 'myroots.exe too small' }
      - name: Add the package to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "${{ steps.msix.outputs.msix }}" --clobber
      - uses: microsoft/setup-msstore-cli@v1
        if: env.MSSTORE == 'true'
      - name: Send to the Microsoft Store
        if: env.MSSTORE == 'true'
        shell: pwsh
        run: |
          msstore reconfigure --tenantId "${{ secrets.MSSTORE_TENANT_ID }}" --sellerId "${{ secrets.MSSTORE_SELLER_ID }}" --clientId "${{ secrets.MSSTORE_CLIENT_ID }}" --clientSecret "${{ secrets.MSSTORE_CLIENT_SECRET }}"
          msstore publish "${{ steps.msix.outputs.msix }}" -id 9MX7K9QKVVCW

  # Windows installer (optionally signed).
  windows:
    needs: desktop
    runs-on: windows-latest
    env:
      SIGN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
      UPDATER: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build the app (no installer yet)
        run: npx tauri build --no-bundle

      - name: Upload the app for signing
        if: env.SIGN == 'true'
        id: up-app
        uses: actions/upload-artifact@v5
        with:
          name: myroots-exe-unsigned
          path: target/release/myroots.exe
      - name: Sign the app (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'myroots' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.up-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-app
          parameters: |
            version: "${{ steps.ver.outputs.version }}"
      - name: Put the signed app in place
        if: env.SIGN == 'true'
        shell: bash
        run: cp signed-app/myroots.exe target/release/myroots.exe

      - name: Make the installer
        run: npx tauri bundle --bundles nsis
      - name: Upload the installer for signing
        if: env.SIGN == 'true'
        id: up-setup
        uses: actions/upload-artifact@v5
        with:
          name: myroots-setup-unsigned
          path: target/release/bundle/nsis/*-setup.exe
      - name: Sign the installer (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'myroots' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.up-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-setup
          parameters: |
            version: "${{ steps.ver.outputs.version }}"
      - name: Put the signed installer in place
        if: env.SIGN == 'true'
        shell: bash
        run: cp signed-setup/*-setup.exe target/release/bundle/nsis/

      # the update signature is made from the final (signed) installer
      - name: Update signature
        if: env.UPDATER == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for f in target/release/bundle/nsis/*-setup.exe; do npx tauri signer sign "$f"; done
          ls target/release/bundle/nsis/

      - name: Keep the installer with the run
        uses: actions/upload-artifact@v5
        with:
          name: myroots-windows
          path: target/release/bundle/nsis/*-setup.exe*
      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" target/release/bundle/nsis/*-setup.exe* --clobber

  web:
    needs: desktop
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:viewer && npm run build:app
      - run: cd dist && zip -r ../myroots-web-${{ github.ref_name }}.zip .
      - name: MyRoots Server and the WordPress plugin (built, zipped and checked)
        run: node scripts/packages.mjs
      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "myroots-web-${{ github.ref_name }}.zip" target/packages/myroots-server.zip target/packages/myroots.zip --clobber
