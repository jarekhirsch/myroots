# Every day: myroots.cc and demo.myroots.cc answer as they should
# (pages, downloads, update files, the demo website and its sign-in).
# A failed run sends the usual GitHub e-mail about a failed workflow.
name: Monitor

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-live.mjs
